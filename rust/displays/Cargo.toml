[package]
name = "swaydesk-displays"
description = "O app Telas (GTK 4): posição, resolução, taxa, escala e rotação das telas no Sway, e o serviço que aplica o perfil de cada conjunto de monitores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "swaydesk_displays"
path = "src/lib.rs"

[[bin]]
name = "swaydesk-displays"
path = "src/main.rs"

[dependencies]
swaydesk-common.workspace = true
swaydesk-displays-logic.workspace = true
swaydesk-ui.workspace = true
pangocairo.workspace = true
gtk4.workspace = true
gtk4-layer-shell.workspace = true
libc.workspace = true
serde_json.workspace = true
