# Generated by the Keyboard and Mouse and touchpad panels of Settings (swaydesk-settings): change it
# there, not by hand, or the next save undoes it. Read after 50-local.conf, so it wins over it.
input type:keyboard {
    xkb_layout "br,us,de,ru"
    xkb_variant "abnt2,dvorak-alt-intl,,phonetic_YAZHERTY"
    xkb_options "grp:alt_shift_toggle,compose:ralt,lv3:ralt_switch"
    repeat_delay 250
    repeat_rate 40
    xkb_numlock enabled
}
input type:pointer {
    pointer_accel -0.35
    natural_scroll disabled
    left_handed enabled
}
input type:touchpad {
    pointer_accel 1
    natural_scroll enabled
    tap disabled
    dwt enabled
}
