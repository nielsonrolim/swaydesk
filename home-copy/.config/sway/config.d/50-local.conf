# Ajustes só desta máquina: atalhos, tela, teclado, mouse e apps. O Sway lê este arquivo depois dos atalhos
# do Swaydesk (e do perfil de atalhos escolhido), então o que estiver aqui vale mais.
# O arquivo é seu: nem a instalação nem as atualizações o sobrescrevem. Para voltar ao modelo, apague-o e
# entre de novo na sessão.
# Descomente o que quiser e rode swaymsg reload num terminal. Um erro aqui aparece numa barra do Sway no
# topo da tela, com a linha do problema.
# A Ajuda do Swaydesk (Super+F1) mostra os atalhos em uso, já com as mudanças deste arquivo. Um comentário
# "##" logo acima de um atalho é a descrição que aparece nela.

# --- Atalhos: trocar o que um atalho faz ---
# Use --no-warn: sem ele, o Sway avisa que a tecla já tinha um atalho.
# ## Open foot
# bindsym --no-warn Ctrl+Alt+t exec foot

# --- Atalhos: tirar um atalho ---
# Só tire o que o perfil em uso tem (veja na Ajuda), escrito como ele define, inclusive opções como
# --locked (o volume e o brilho, que valem com a tela bloqueada). Tirar uma tecla sem atalho, ou sem a
# opção dele, é um erro de config. A tecla Print existe em todos os perfis, sem opções.
# unbindsym Print
# unbindsym --locked XF86AudioRaiseVolume

# --- Atalhos: criar um atalho ---
# Escolha uma tecla livre (a Ajuda mostra as ocupadas). Mod4 é a tecla Super. Super+F2 a F12 e
# Super+Ctrl+Alt+<letra> ficam livres em todos os perfis.
# ## Open another terminal
# bindsym Mod4+F12 exec kitty

# --- Tela: o nome da saída vem de `swaymsg -t get_outputs` ---
# O app Telas (ou o nwg-displays) grava as telas depois deste arquivo e vale mais que um output daqui.
# output HDMI-A-1 mode 1920x1080@60Hz scale 1

# --- Teclado: dois layouts (o atalho que troca está na Ajuda: Super+Espaço no perfil swaydesk) ---
# input type:keyboard {
#     xkb_layout  br,us
#     xkb_variant abnt2,intl
# }

# --- Mouse ---
# input type:pointer {
#     left_handed    enabled
#     natural_scroll enabled
# }

# --- Programas ao entrar na sessão ---
# exec meu-programa

# --- Apps nos workspaces ---
# assign [app_id="^kitty$"] workspace number 3
