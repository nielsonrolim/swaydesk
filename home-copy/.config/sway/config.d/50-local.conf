# Ajustes só desta máquina. Lido no fim de ~/.config/sway/config: o que estiver aqui vale mais.
# Este arquivo é seu: a instalação não o sobrescreve. Descomente o que quiser e rode swaymsg reload.

# --- Tela: o nome da saída vem de `swaymsg -t get_outputs` ---
# output HDMI-A-1 mode 1920x1080@60Hz scale 1

# --- Teclado: dois layouts, trocados com Super+Espaço ---
# input type:keyboard {
#     xkb_layout  br,us
#     xkb_variant abnt2,intl
# }

# --- Mouse ---
# input type:pointer {
#     left_handed    enabled
#     natural_scroll enabled
# }

# --- Programas ao entrar na sessão ---
# exec meu-programa

# --- Apps nos workspaces ---
# assign [app_id="^kitty$"] workspace number 3

# --- Atalhos: para trocar um que já existe, use --no-warn, ou o Sway avisa do atalho repetido ---
# Um comentário "##" logo acima descreve o atalho na Ajuda do Swaydesk (Super+F1):
# ## Open foot
# bindsym --no-warn Ctrl+Alt+t exec foot
