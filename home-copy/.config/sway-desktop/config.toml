# Config do desktop. Este arquivo é seu: a instalação não o sobrescreve.
# Os programas leem ao abrir: o que fica aberto, como a Waybar, precisa ser reiniciado.

# Idioma dos textos, data, tempo e wallpaper do dia, como "pt_BR". Vazio: os textos seguem o
# LANGUAGE ou o LANG, e a data, o LC_TIME ou o LANG
locale = ""

# Cidade da previsão do tempo, como "Fortaleza". Vazio: vem do IP
weather_location = ""

# O país dos feriados do calendário, como "BR" ou "US", com a python3-holidays instalada (a do Debian 13 ou
# do Ubuntu 26.04: a do Mint 22 é antiga demais). Vazio: o país do locale ("BR" em pt_BR), sem aviso se
# faltar a biblioteca. "none": nenhum
holidays = ""

# Tema, ícones e cor de destaque. Para trocar tudo junto, em todo o desktop: o app Tema do Desktop
# ou o sway-theme. Com o Papirus, as pastas ficam na cor de folder_color, uma das do sway-theme colors.
# Vazio: a cor do Papirus mais perto do destaque. Mudou à mão? Rode sway-desktop-config apply
gtk_theme = "Mint-Y-Dark-Teal"
icon_theme = "Papirus-Dark"
accent = "#199ca8"
folder_color = ""

# Gerenciador de arquivos do atalho Ctrl+Alt+E, da gaveta e da dock: o nome do comando.
# Vazio: o primeiro instalado entre nemo, thunar, nautilus e dolphin. No Mint é o Nemo; no Ubuntu
# e no Debian, o ./install.sh --deps instala o Thunar, mais leve que o Nemo.
# Também servem o "nautilus" (GNOME) e o "dolphin" (KDE), se instalados; o Dolphin traz parte do
# KDE e segue o tema do Qt, não o do GTK. Para trocar, instale o pacote, escreva o nome aqui
# e rode sway-desktop-config generate, para as pastas abertas por outros apps também irem para ele
file_manager = ""

# A versão dos componentes (grade de apps e, aos poucos, os outros). "auto": a versão em Rust + GTK 4
# onde ela estiver instalada (./install.sh --rust) e carregar; senão, a em Python. "python": sempre a
# em Python. "rust": a em Rust, com um aviso no log quando ela faltar. Vale ao abrir o componente
components = "auto"

# Componentes da sessão: false desliga, e a chave ausente liga. Vale ao entrar de novo na sessão; a barra, ao
# reiniciar a Waybar (sway-waybar restart). As tabelas ficam no fim do arquivo: uma chave solta depois delas
# entraria na tabela
[enabled]
dock = true
app_grid = true            # a grade de apps: desligada, nem o Super nem o botão da dock a abrem
switcher = true            # o seletor do Alt+Tab: desligado, o Alt+Tab troca de janela sem o cartão
notifications = true       # desligadas, nenhum app consegue mostrar uma notificação
osd = true                 # o indicador de volume e brilho (as teclas continuam mudando o volume e o brilho)
clipboard_history = true   # o histórico da área de transferência (o cliphist)
nightlight = true          # a luz noturna volta ao último modo no login
bing_wallpaper = true      # o wallpaper do dia do Bing
polkit_agent = true        # a janela da senha de administrador: desligada, quem pede a senha falha
update_notifier = true     # o aviso de atualizações da distro
displays = true            # os perfis de telas ao plugar um monitor e na tampa, e o resgate quando
                           # nenhuma tela fica ligada (o app Telas continua)

# Os módulos da barra (os workspaces e a bandeja ficam sempre)
[enabled.bar]
weather = true
clock = true
media = true
recording = true
notifications = true
clipboard = true
language = true
system = true
brightness = true
caffeine = true
bluetooth = true
network = true
volume = true
battery = true
power = true

# Os efeitos do SwayFX, um Sway com cantos arredondados, blur e sombras. No Arch, ele é opcional e vem do
# AUR (yay -S swayfx; para voltar, sudo pacman -S sway). Com o Sway comum, esta seção não faz nada. Cada
# efeito liga ou desliga sozinho; sem a chave, vale o padrão. O blur da barra, da dock e dos popups vem
# desligado por padrão: na VM (virgl) apareceu lixo visual; ligue com layer_blur = true. Mudou? Rode
# sway-desktop-config generate e swaymsg reload (ou entre de novo na sessão)
[effects]
corner_radius = 10   # os cantos das janelas e das camadas, em pixels, de 0 (retos) a 30
blur = true          # o blur atrás das janelas transparentes
shadows = true       # uma sombra leve nas janelas
layer_blur = false   # o blur atrás da Waybar, da dock, da grade, dos popups, das notificações e do OSD
dim_inactive = 0.0   # escurecer as janelas sem o foco, de 0.0 (nada) a 1.0
