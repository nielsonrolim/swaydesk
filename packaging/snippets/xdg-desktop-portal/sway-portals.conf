# swaydesk-portal: accent color portal, for plain Sway. More: https://swaydesk.nielsonrolim.com/en-us/components/portal/
#
# Opt-in: xdg-desktop-portal reads this file only after you copy it to
#   ~/.config/xdg-desktop-portal/sway-portals.conf
# A file there replaces the sway package's /usr/share/xdg-desktop-portal/sway-portals.conf as a whole; this one keeps
# its lines and adds the Settings one. If you already have your own, add only the Settings line to its [preferred].
# It needs xdg-desktop-portal-gtk and xdg-desktop-portal-wlr, and XDG_CURRENT_DESKTOP=sway in the systemd user
# environment, where the portal starts: sway's own /etc/sway/config.d/50-systemd-user.conf imports it; without it,
# add to your Sway config:
#   exec systemctl --user import-environment XDG_CURRENT_DESKTOP WAYLAND_DISPLAY
# (and export XDG_CURRENT_DESKTOP=sway before starting Sway, if nothing sets it). Then log in again.
# The accent comes from ~/.config/swaydesk/config.toml (accent); light and dark, from the gtk backend. Inside the
# Swaydesk session this is already in place.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# As in the sway package's file: gtk's Inhibit needs org.gnome.SessionManager, which Sway doesn't have; with no
# backend, Firefox and others use Wayland's idle-inhibit instead
org.freedesktop.impl.portal.Inhibit=none
# The accent color comes from swaydesk-portal, which only has that; the rest, from gtk
org.freedesktop.impl.portal.Settings=swaydesktop;gtk
