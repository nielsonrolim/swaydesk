# swaydesk-theme-tool: the Swaydesk tabs, for plain Sway. More: https://swaydesk.org/en-us/components/theme/
#
# Opt-in: nothing reads this file until you add this line to your Sway config (~/.config/sway/config), after
# its "set $mod" (at the end, next to "include /etc/sway/config.d/*", is fine):
#   include /usr/share/swaydesk/sway/config.d/50-swaydesk-theme-tool.conf
# The titlebars of tabbed and stacked groups become taller tabs, with the title centred and a 1 px outline around
# each. Their colors come from the accent and the style you pick in the Desktop Theme app, which writes them to
# ~/.config/sway/config.d/00-accent.conf: the focused tab in the accent, the visible tab of an unfocused group in a
# darker one (lighter with a light theme), the others in grey. Until that file exists, Sway's own colors stay.
# A line of yours after the include wins. Sway's font line sets the titles' font; yours stays as it is.

titlebar_padding 12 6
title_align center
titlebar_border_thickness 1
include ~/.config/sway/config.d/00-accent.conf
