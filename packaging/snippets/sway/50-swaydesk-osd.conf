# swaydesk-osd: the on-screen level bar, with the volume and brightness keys, for plain Sway. More: https://swaydesk.org/en-us/components/osd/
#
# Opt-in: nothing reads this file until you add this line to your Sway config (~/.config/sway/config), after
# its "set $mod" (at the end, next to "include /etc/sway/config.d/*", is fine):
#   include /usr/share/swaydesk/sway/config.d/50-swaydesk-osd.conf
# The component runs as the systemd user unit swaydesk-osd.service, restarted if it crashes. swaydesk-sway-unit (in
# swaydesk-common) hands it this Sway's DISPLAY, WAYLAND_DISPLAY, SWAYSOCK and XDG_CURRENT_DESKTOP, as Sway's own
# 50-systemd-user.conf does, and stops it and takes them back when this Sway exits. Inside the Swaydesk session it
# does nothing (the session starts the component itself). The user manager is one per account: don't include this
# in a second or nested Sway, or next to a Swaydesk session, at the same time.
# Without a systemd user session, replace the exec line with the one in the comment at the end.
# Volume through wpctl (wireplumber), brightness through brightnessctl. These replace earlier bindings of the
# same keys without a warning (--no-warn), so include this file after the stock config's and your own; a binding
# of yours after the include wins instead.

exec ~/.local/bin/swaydesk-sway-unit swaydesk-osd.service

# The volume and brightness keys change the level and show it (also on the lock screen)
bindsym --locked --no-warn XF86AudioRaiseVolume  exec ~/.local/bin/sway-osd volume up
bindsym --locked --no-warn XF86AudioLowerVolume  exec ~/.local/bin/sway-osd volume down
bindsym --locked --no-warn XF86AudioMute         exec ~/.local/bin/sway-osd volume mute
bindsym --locked --no-warn XF86MonBrightnessUp   exec ~/.local/bin/sway-osd brightness up
bindsym --locked --no-warn XF86MonBrightnessDown exec ~/.local/bin/sway-osd brightness down

# Without a systemd user session (no restart if it crashes):
# exec sh -c '[ -n "${SWAYDESK_SESSION:-}" ] && exit 0; exec ~/.local/bin/sway-osd-bar'
