# swaydesk-clipboard: the clipboard history (text and images, through cliphist), for plain Sway. More: https://swaydesk.nielsonrolim.com/en-us/components/clipboard/
#
# Opt-in: nothing reads this file until you add this line to your Sway config (~/.config/sway/config), after
# its "set $mod" (at the end, next to "include /etc/sway/config.d/*", is fine):
#   include /usr/share/swaydesk/sway/config.d/50-swaydesk-clipboard.conf
# The component runs as the systemd user unit swaydesk-clipboard.service, restarted if it crashes. swaydesk-sway-unit (in
# swaydesk-common) hands it this Sway's DISPLAY, WAYLAND_DISPLAY, SWAYSOCK and XDG_CURRENT_DESKTOP, as Sway's own
# 50-systemd-user.conf does, and stops it and takes them back when this Sway exits. Inside the Swaydesk session it
# does nothing (the session starts the component itself). The user manager is one per account: don't include this
# in a second or nested Sway, or next to a Swaydesk session, at the same time.
# Without a systemd user session, replace the exec line with the one in the comment at the end.
# If your config already runs "wl-paste --watch cliphist store", remove that line: the unit runs the same watchers.

exec ~/.local/bin/swaydesk-sway-unit swaydesk-clipboard.service

# Show the clipboard history (Super+Shift+V)
bindsym $mod+Shift+v exec ~/.local/bin/waybar-clipboard-popup

# Without a systemd user session (no restart if it crashes):
# exec sh -c '[ -n "${SWAYDESK_SESSION:-}" ] && exit 0; exec wl-paste --type text --watch cliphist store'
# exec sh -c '[ -n "${SWAYDESK_SESSION:-}" ] && exit 0; exec wl-paste --type image --watch cliphist store'
# exec sh -c '[ -n "${SWAYDESK_SESSION:-}" ] && exit 0; exec wl-paste --watch ~/.local/bin/sway-clip-store'
