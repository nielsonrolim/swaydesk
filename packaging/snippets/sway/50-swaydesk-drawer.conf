# swaydesk-drawer: the app grid, for plain Sway. More: https://swaydesk.org/en-us/components/app-grid/
#
# Opt-in: nothing reads this file until you add this line to your Sway config (~/.config/sway/config), after
# its "set $mod" (at the end, next to "include /etc/sway/config.d/*", is fine):
#   include /usr/share/swaydesk/sway/config.d/50-swaydesk-drawer.conf
# The component runs as the systemd user unit swaydesk-drawer.service, restarted if it crashes. swaydesk-sway-unit (in
# swaydesk-common) hands it this Sway's DISPLAY, WAYLAND_DISPLAY, SWAYSOCK and XDG_CURRENT_DESKTOP, as Sway's own
# 50-systemd-user.conf does, and stops it and takes them back when this Sway exits. Inside the Swaydesk session it
# does nothing (the session starts the component itself). The user manager is one per account: don't include this
# in a second or nested Sway, or next to a Swaydesk session, at the same time.
# Without a systemd user session, replace the exec line with the one in the comment at the end.
# If your config already starts it with its own exec line, remove that line: a second copy exits at once.

exec ~/.local/bin/swaydesk-sway-unit swaydesk-drawer.service

# Open or close the app grid (Super+Shift+D; Super+D stays your launcher)
bindsym $mod+Shift+d exec ~/.local/bin/sway-drawer

# Without a systemd user session (no restart if it crashes):
# exec sh -c '[ -n "${SWAYDESK_SESSION:-}" ] && exit 0; while swaymsg -t get_version >/dev/null 2>&1; do ~/.local/bin/sway-drawer start; [ $? -eq 3 ] && break; sleep 1; done'
