# swaydesk-lock: the lock screen, for plain Sway. More: https://swaydesk.org/en-us/components/lock/
#
# Opt-in: nothing reads this file until you add this line to your Sway config (~/.config/sway/config), after
# its "set $mod" (at the end, next to "include /etc/sway/config.d/*", is fine):
#   include /usr/share/swaydesk/sway/config.d/50-swaydesk-lock.conf
# Ctrl+Alt+L locks, and so do 10 minutes without input and going to sleep, through your own swayidle (the
# swayidle package). If your config already starts swayidle, keep a single one: add the timeout and the
# before-sleep below to your own line instead of including this file.
# Inside the Swaydesk session the exec line does nothing (the session has its own idle lock).

bindsym Ctrl+Alt+l exec /usr/bin/swaydesk-lock
exec sh -c '[ -n "${SWAYDESK_SESSION:-}" ] && exit 0; exec swayidle -w timeout 600 /usr/bin/swaydesk-lock before-sleep /usr/bin/swaydesk-lock'
