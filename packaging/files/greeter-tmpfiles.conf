# A memória da tela de login (último usuário e sessão de cada um): só o usuário do greeter lê e grava
d /var/lib/swaydesk-greeter 0700 @USER@ @USER@ -
# O cache da tela (o do fontconfig, o dos shaders): sem ele, o fontconfig relia as fontes a cada abertura e
# avisava no journal "No writable cache directories" (o usuário do greeter não tem uma pasta pessoal gravável)
d /var/lib/swaydesk-greeter/cache 0700 @USER@ @USER@ -
