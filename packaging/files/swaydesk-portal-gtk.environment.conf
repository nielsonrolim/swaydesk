# O diretório com a ativação direta do portal do gtk (swaydesk-desktop) vem antes dos outros no
# XDG_DATA_DIRS do systemd do usuário, que o dbus-daemon e o dbus-broker usam para achar os .service. O
# padrão da especificação vale quando a variável não está definida
XDG_DATA_DIRS=@DIR@:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
