# O portal do gtk só com uma tela viva, no Arch (dbus-broker): o sway-portal-gtk confere a tela e só então abre
# o portal do pacote. Lá a ativação vai pelo SystemdService do .service do xdg-desktop-portal-gtk, e o
# dbus-broker desiste na hora quando a unit falha, então basta trocar o ExecStart. Um segundo .service com o
# mesmo nome (a ativação direta do Debian e do Ubuntu, onde o dbus-daemon esperava os 120 s) faria o
# dbus-broker avisar "Ignoring duplicate name" a cada carga
[Service]
ExecStart=
ExecStart=@LIBEXEC@/sway-portal-gtk
