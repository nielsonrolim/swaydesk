# Do pacote swaydesk-desktop. O pacote waybar liga o waybar.service no graphical-session.target de todos os
# usuários, e esse target sobe também no GNOME e no Plasma: no Plasma aparecia uma segunda barra, com o config
# padrão, e no GNOME, sem layer-shell, a unit falhava em todo login. Aqui ela só sobe no Sway e nos
# compositores que a usam pelo systemd (os mesmos do OnlyShowIn do app Tema). Fora deles, a condição falsa
# só pula a unit, sem marcá-la como falha.
# Na sessão do swaydesk-desktop ela também não sobe: a Waybar vem do config do Sway. O sway-session exporta o
# SWAYDESK_SESSION para o systemd do usuário antes de abrir o Sway.
# Os "|" fazem desses nomes uma lista de alternativas; o !SWAYDESK_SESSION vale sempre.
[Unit]
ConditionEnvironment=!SWAYDESK_SESSION
ConditionEnvironment=|XDG_CURRENT_DESKTOP=sway
ConditionEnvironment=|XDG_CURRENT_DESKTOP=Hyprland
ConditionEnvironment=|XDG_CURRENT_DESKTOP=river
ConditionEnvironment=|XDG_CURRENT_DESKTOP=niri
