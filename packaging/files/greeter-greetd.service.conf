# O greetd abre a tela de login do Sway Desktop (swaydesk-greeter), no lugar do greeter do
# /etc/greetd/config.toml. Para voltar a ele sem remover o pacote:
#   mkdir -p /etc/systemd/system/greetd.service.d
#   ln -s /dev/null /etc/systemd/system/greetd.service.d/swaydesk-greeter.conf
#   systemctl daemon-reload    (vale no próximo boot, ou com um systemctl restart greetd)
[Service]
ExecStart=
ExecStart=greetd --config /usr/share/swaydesk-greeter/greetd.toml
