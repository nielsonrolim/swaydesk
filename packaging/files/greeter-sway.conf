# O Sway da tela de login do pacote swaydesk-greeter: o greetd o abre como o usuário dele (greetd.toml do
# pacote). Sem atalhos e sem barra: só a tela, que fecha o Sway ao sair (o greetd abre a sessão no lugar).
# Ajustes da máquina (monitores, escala) vão em /etc/swaydesk-greeter/sway.d/*.conf; o teclado do sistema e
# o idioma a tela lê sozinha.

# A cor do fundo da tela, para não piscar preto enquanto ela abre
output * bg #1b1b1f solid_color
default_border none
# Sem servidor X no processo que vê as senhas: a tela é só GTK 4 no Wayland
xwayland disable
include /etc/swaydesk-greeter/sway.d/*.conf

# Sem o barramento da sessão (o greeter não tem um), o GTK não procura o de acessibilidade. Se a tela sair
# com erro (o GTK não abriu, um pacote quebrado), espera antes de fechar o Sway: o greetd a reabre na hora,
# e sem a pausa ficaria num laço gastando a CPU
exec "GTK_A11Y=none swaydesk-greeter || sleep 5; swaymsg exit"
