# O Sway da tela de login do pacote swaydesk-greeter: o greetd o abre como o usuário dele (greetd.toml do
# pacote). Sem atalhos e sem barra: só a tela, que fecha o Sway ao sair (o greetd abre a sessão no lugar).
# Ajustes da máquina (monitores, escala) vão em /etc/swaydesk-greeter/sway.d/*.conf; o teclado do sistema e
# o idioma a tela lê sozinha.

# A cor do fundo da tela, para não piscar preto enquanto ela abre
output * bg #1b1b1f solid_color
default_border none
# Sem servidor X no processo que vê as senhas: a tela é só GTK 4 no Wayland
xwayland disable
include /etc/swaydesk-greeter/sway.d/*.conf

# O usuário do greeter tem um barramento de sessão (o systemd dele sobe com a sessão da tela), mas a tela não
# precisa do que ele ativaria:
# - GTK_A11Y=none: o GTK não abre o barramento de acessibilidade (o at-spi);
# - GDK_DEBUG=no-portals: o GTK pedia o esquema de cores ao portal de Settings, e isso ativava o
#   xdg-desktop-portal e o do gtk para o usuário do greeter ("Failed to start xdg-desktop-portal-gtk.service"
#   no journal). A tela tem cores próprias.
# Se a tela sair com erro (o GTK não abriu, um pacote quebrado), espera antes de fechar o Sway: o greetd a
# reabre na hora, e sem a pausa ficaria num laço gastando a CPU
# O log da tela (o stdout e o stderr: um locale que falta, um erro do greetd, os avisos do GTK) vai ao journal,
# com a tag swaydesk-greeter (journalctl -t swaydesk-greeter): o greetd não guarda a saída do Sway dela. O
# systemd-cat executa a tela no lugar dele, então o código de saída e a pausa continuam valendo. Sem o journal
# (o socket do journald ou o systemd-cat faltando), a tela abre do mesmo jeito, sem o log. A senha digitada, as
# perguntas do PAM e um "senha errada" nunca vão ao log: a tela só registra erros do sistema
exec "export GTK_A11Y=none GDK_DEBUG=no-portals; if [ -S /run/systemd/journal/stdout ] && command -v systemd-cat >/dev/null; then systemd-cat -t swaydesk-greeter swaydesk-greeter; else swaydesk-greeter; fi || sleep 5; swaymsg exit"
