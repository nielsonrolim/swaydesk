# Do pacote swaydesk-desktop: na sessão dele, este serviço não sobe pelo graphical-session.target (a
# Waybar sobe pelo config do Sway, e o gammastep pelo sway-nightlight). O sway-session exporta o
# SWAYDESK_SESSION para o systemd do usuário antes de abrir o Sway.
[Unit]
ConditionEnvironment=!SWAYDESK_SESSION
