# Perfil niri: as teclas do config padrão do niri (Super+T terminal, Super+D lançador, H/J/K/L e as setas,
# Super+Ctrl para mover, Super+Shift para os monitores, Page_Up/Page_Down e I/U para os workspaces) num Sway:
# só as teclas, sem as colunas que rolam. Super+O (o overview) busca as janelas abertas, e Super+Shift+/ (o
# hotkey overlay) abre esta Ajuda. Vem depois do keys/base.conf. As ações que o niri não tem ficam em teclas
# livres dele. "## Texto" descreve o bind de baixo na Ajuda (Super+F1), e "### Texto" abre uma seção

# --- Sessão e apps ---
### Session and apps
## Reload the Sway config
bindsym $mod+Ctrl+Shift+r reload
## Log out: the session menu
bindsym $mod+Shift+e exec $bin/session-menu
## Close the window
bindsym $mod+q kill
## Open the terminal
bindsym $mod+t exec $term
## Open the launcher
bindsym $mod+d exec $bin/sway-launcher toggle
## Lock the screen
bindsym $mod+Alt+l exec $lock
## Turn the screens off
bindsym $mod+Shift+p output * power off
## Show the notifications
bindsym $mod+n exec $bin/waybar-notifications-popup
## Show the clipboard history
bindsym $mod+Alt+v exec $bin/waybar-clipboard-popup
## Search the open windows
bindsym $mod+o exec $bin/sway-launcher windows
## Switch the keyboard layout
bindsym $mod+space input type:keyboard xkb_switch_layout next
## Show this help
bindsym $mod+Shift+slash exec $bin/sway-help

# --- Foco ---
### Focus
## Focus the window on the left
bindsym $mod+h     focus left
bindsym $mod+Left  focus left
## Focus the window below
bindsym $mod+j     focus down
bindsym $mod+Down  focus down
## Focus the window above
bindsym $mod+k     focus up
bindsym $mod+Up    focus up
## Focus the window on the right
bindsym $mod+l     focus right
bindsym $mod+Right focus right
## Switch the focus between floating and tiled windows
bindsym $mod+Shift+v focus mode_toggle

# --- Mover e redimensionar ---
### Move and resize
## Move the window left
bindsym $mod+Ctrl+h     move left
bindsym $mod+Ctrl+Left  move left
## Move the window down
bindsym $mod+Ctrl+j     move down
bindsym $mod+Ctrl+Down  move down
## Move the window up
bindsym $mod+Ctrl+k     move up
bindsym $mod+Ctrl+Up    move up
## Move the window right
bindsym $mod+Ctrl+l     move right
bindsym $mod+Ctrl+Right move right
## Narrower
bindsym $mod+minus resize shrink width 10ppt
## Wider
bindsym $mod+equal resize grow width 10ppt
## Shorter
bindsym $mod+Shift+minus resize shrink height 10ppt
## Taller
bindsym $mod+Shift+equal resize grow height 10ppt

# --- Janelas ---
### Windows
## Swap the window with the main one
bindsym $mod+Return exec $bin/sway-master
## Float or tile the window
bindsym $mod+v floating toggle
# O niri maximiza a coluna no Super+F; o Sway não tem coluna, então os dois fazem a tela cheia
## Fullscreen
bindsym $mod+f       fullscreen toggle
bindsym $mod+Shift+f fullscreen toggle
## Hide the window in the scratchpad
bindsym $mod+Shift+z move scratchpad
## Show the hidden windows of the scratchpad
bindsym $mod+z scratchpad show
## Keep the window on every workspace
bindsym $mod+Shift+g sticky toggle

# --- Layouts ---
### Layouts
## Tabs on or off
bindsym $mod+w layout toggle tabbed split
## Wider gaps between windows
bindsym $mod+Ctrl+x gaps inner current plus 2
## Narrower gaps between windows
bindsym $mod+Ctrl+z gaps inner current minus 2
## Gaps between windows on or off
bindsym $mod+Alt+g gaps inner current toggle 5

# --- Workspaces: como no niri, mover a janela leva o foco junto; U desce (próximo) e I sobe (anterior) ---
### Workspaces
## Go to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
## Move the window to workspace
bindsym $mod+Ctrl+1 move container to workspace number 1, workspace number 1
bindsym $mod+Ctrl+2 move container to workspace number 2, workspace number 2
bindsym $mod+Ctrl+3 move container to workspace number 3, workspace number 3
bindsym $mod+Ctrl+4 move container to workspace number 4, workspace number 4
bindsym $mod+Ctrl+5 move container to workspace number 5, workspace number 5
bindsym $mod+Ctrl+6 move container to workspace number 6, workspace number 6
bindsym $mod+Ctrl+7 move container to workspace number 7, workspace number 7
bindsym $mod+Ctrl+8 move container to workspace number 8, workspace number 8
bindsym $mod+Ctrl+9 move container to workspace number 9, workspace number 9
## Go to the previous workspace
bindsym $mod+Page_Up   exec $bin/sway-ws prev
bindsym $mod+i         exec $bin/sway-ws prev
## Go to the next workspace
bindsym $mod+Page_Down exec $bin/sway-ws next
bindsym $mod+u         exec $bin/sway-ws next
## Move the window to the previous workspace
bindsym $mod+Ctrl+Page_Up   exec $bin/sway-ws prev move
bindsym $mod+Ctrl+i         exec $bin/sway-ws prev move
## Move the window to the next workspace
bindsym $mod+Ctrl+Page_Down exec $bin/sway-ws next move
bindsym $mod+Ctrl+u         exec $bin/sway-ws next move

# --- Monitores ---
### Monitors
## Focus the monitor on the left
bindsym $mod+Shift+Left  focus output left
bindsym $mod+Shift+h     focus output left
## Focus the monitor on the right
bindsym $mod+Shift+Right focus output right
bindsym $mod+Shift+l     focus output right
## Move the window to the monitor on the left
bindsym $mod+Ctrl+Shift+Left  move container to output left,  focus output left
bindsym $mod+Ctrl+Shift+h     move container to output left,  focus output left
## Move the window to the monitor on the right
bindsym $mod+Ctrl+Shift+Right move container to output right, focus output right
bindsym $mod+Ctrl+Shift+l     move container to output right, focus output right

# --- Painéis de captura e de gravação (sway-capture) ---
### Screenshots and recording
## Screenshot panel
bindsym $mod+Alt+s exec $bin/sway-capture shot
## Screen recording panel; during a recording, stops it
bindsym $mod+Alt+r exec $bin/sway-capture rec
