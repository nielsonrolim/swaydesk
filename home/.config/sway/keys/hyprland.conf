# Perfil hyprland: as teclas do hyprland.conf de exemplo (Super+Q terminal, Super+C fechar, Super+V flutuar,
# Super+R lançador, Super+S scratchpad, as setas para o foco) num Sway: só as teclas, os layouts são os do Sway.
# Vem depois do keys/base.conf. As ações que o exemplo não tem ficam em teclas livres dele.
# "## Texto" descreve o bind de baixo na Ajuda (Super+F1), e "### Texto" abre uma seção

# --- Sessão e apps ---
### Session and apps
## Reload the Sway config
bindsym $mod+Shift+c reload
## Log out: the session menu
bindsym $mod+m exec $bin/session-menu
## Close the window
bindsym $mod+c kill
## Open the terminal
bindsym $mod+q exec $term
## Open the launcher
bindsym $mod+r exec $bin/sway-launcher toggle
## Open the file manager
bindsym $mod+e exec $bin/sway-files
## Show the notifications
bindsym $mod+n exec $bin/waybar-notifications-popup
## Show the clipboard history
bindsym $mod+Shift+v exec $bin/waybar-clipboard-popup
## Search the open windows
bindcode $mod+49 exec $bin/sway-launcher windows
## Switch the keyboard layout
bindsym $mod+space input type:keyboard xkb_switch_layout next
## Show this help
bindsym $mod+slash exec $bin/sway-help

# --- Foco ---
### Focus
## Focus the window on the left
bindsym $mod+Left  focus left
## Focus the window below
bindsym $mod+Down  focus down
## Focus the window above
bindsym $mod+Up    focus up
## Focus the window on the right
bindsym $mod+Right focus right
## Focus the next window on the screen
bindsym $mod+Tab       focus next
## Focus the previous window on the screen
bindsym $mod+Shift+Tab focus prev

# --- Mover e redimensionar ---
### Move and resize
## Move the window left
bindsym $mod+Shift+Left  move left
## Move the window down
bindsym $mod+Shift+Down  move down
## Move the window up
bindsym $mod+Shift+Up    move up
## Move the window right
bindsym $mod+Shift+Right move right
## Resize the window toward the left
bindsym $mod+Ctrl+Left  exec $bin/sway-resize left
## Resize the window toward the right
bindsym $mod+Ctrl+Right exec $bin/sway-resize right
## Resize the window downward
bindsym $mod+Ctrl+Down  exec $bin/sway-resize down
## Resize the window upward
bindsym $mod+Ctrl+Up    exec $bin/sway-resize up

# --- Janelas ---
### Windows
## Swap the window with the main one
bindsym $mod+Return exec $bin/sway-master
## Float or tile the window
bindsym $mod+v floating toggle
## Float or tile every window of the workspace
bindsym $mod+Shift+f [workspace=__focused__] floating toggle
## Fullscreen
bindsym $mod+f fullscreen toggle
# O workspace especial do Hyprland é o scratchpad do Sway
## Hide the window in the scratchpad
bindsym $mod+Shift+s move scratchpad
## Show the hidden windows of the scratchpad
bindsym $mod+s scratchpad show
## Keep the window on every workspace
bindsym $mod+Shift+g sticky toggle

# --- Layouts ---
### Layouts
## Next layout: side by side, stacked, tabs
bindsym $mod+bracketright layout toggle splith splitv stacking tabbed
## Side-by-side layout
bindsym $mod+Ctrl+t layout splith
## Open the next window in the other direction
bindsym $mod+j split toggle
## Wider gaps between windows
bindsym $mod+Ctrl+x gaps inner current plus 2
## Narrower gaps between windows
bindsym $mod+Ctrl+z gaps inner current minus 2
## Gaps between windows on or off
bindsym $mod+Alt+r gaps inner current toggle 5

# --- Workspaces: como no Hyprland, mover a janela leva o foco junto ---
### Workspaces
## Go to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
## Move the window to workspace
bindsym $mod+Shift+1 move container to workspace number 1, workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2, workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3, workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4, workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5, workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6, workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7, workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8, workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9, workspace number 9
## Go to the previous workspace
bindsym $mod+Page_Up   exec $bin/sway-ws prev
## Go to the next workspace
bindsym $mod+Page_Down exec $bin/sway-ws next
## Move the window to the previous workspace
bindsym $mod+Shift+Page_Up   exec $bin/sway-ws prev move
## Move the window to the next workspace
bindsym $mod+Shift+Page_Down exec $bin/sway-ws next move

# --- Monitores ---
### Monitors
## Focus the monitor on the left
bindsym $mod+comma  focus output left
## Focus the monitor on the right
bindsym $mod+period focus output right
## Move the window to the monitor on the left
bindsym $mod+Shift+comma  move container to output left,  focus output left
## Move the window to the monitor on the right
bindsym $mod+Shift+period move container to output right, focus output right

# --- Painéis de captura e de gravação (sway-capture) ---
### Screenshots and recording
## Screenshot panel
bindsym $mod+Shift+e exec $bin/sway-capture shot
## Screen recording panel; during a recording, stops it
bindsym $mod+Shift+r exec $bin/sway-capture rec
