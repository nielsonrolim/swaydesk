# Perfil dwm: o Mod é Alt, como no dwm, e não Super. Por isso, alguns atalhos dos apps com Alt (como o
# Alt+F, que abre o menu Arquivo) deixam de chegar a eles. Dois atalhos mudam só aqui: os cartões de janelas
# (Alt+Tab e Alt+Shift+Tab nos outros perfis) vão para Super+Tab e Super+Shift+Tab, porque Alt+Tab volta ao
# último workspace; e o lançador (Alt+Space) vai para Super+Space, porque Alt+Space troca o layout das janelas.
# As ações do Swaydesk que o dwm não tem (notificações, área de transferência, busca de janelas, captura e
# gravação) ficam em Super. Janela flutuante com o mouse: Alt+arrastar. O layout do teclado: Super+Ctrl+Space.
# O $mod continua sendo o Super (o 50-local.conf o usa): aqui, o Alt vai escrito como Mod1. Vem depois do
# keys/base.conf. "## Texto" descreve o bind de baixo na Ajuda (Super+F1), e "### Texto" abre uma seção

# --- O que muda da base ---
floating_modifier Mod1 normal
unbindsym Alt+Shift+Tab

# --- Sessão e apps ---
### Session and apps
## Reload the Sway config
bindsym $mod+r reload
## Log out: the session menu
bindsym Mod1+Shift+q exec $bin/session-menu
## Close the window
bindsym Mod1+Shift+c kill
## Open the terminal
bindsym Mod1+Shift+Return exec $term
## Open the launcher
bindsym Mod1+p exec $bin/sway-launcher toggle
bindsym $mod+space exec $bin/sway-launcher toggle
## Show or hide the bar
bindsym Mod1+b exec pkill -SIGUSR1 -u "$(id -u)" -x waybar
## Show the notifications
bindsym $mod+n exec $bin/waybar-notifications-popup
## Show the clipboard history
bindsym $mod+v exec $bin/waybar-clipboard-popup
## Search the open windows
bindcode $mod+49 exec $bin/sway-launcher windows
## Switch the keyboard layout
bindsym $mod+Ctrl+space input type:keyboard xkb_switch_layout next
## Show this help
bindsym $mod+slash exec $bin/sway-help

# --- Foco ---
### Focus
## Switch to the next window, in the order of use
bindsym $mod+Tab       exec $bin/sway-switcher next
## Switch to the previous window, in the order of use
bindsym $mod+Shift+Tab exec $bin/sway-switcher prev
## Focus the next window on the screen
bindsym Mod1+j focus next
## Focus the previous window on the screen
bindsym Mod1+k focus prev
## Focus the window on the left
bindsym $mod+Alt+Left  focus left
## Focus the window below
bindsym $mod+Alt+Down  focus down
## Focus the window above
bindsym $mod+Alt+Up    focus up
## Focus the window on the right
bindsym $mod+Alt+Right focus right

# --- Mover e redimensionar ---
### Move and resize
## Move the window down the stack
bindsym Mod1+Shift+j move down
## Move the window up the stack
bindsym Mod1+Shift+k move up
## Resize the window toward the left
bindsym Mod1+h exec $bin/sway-resize left
## Resize the window toward the right
bindsym Mod1+l exec $bin/sway-resize right

# --- Janelas ---
### Windows
## Swap the window with the main one
bindsym Mod1+Return exec $bin/sway-master
## Float or tile the window
bindsym Mod1+Shift+space floating toggle
## Float or tile every window of the workspace
bindsym Mod1+f [workspace=__focused__] floating toggle
## Fullscreen
bindsym $mod+Shift+f fullscreen toggle
## Hide the window in the scratchpad
bindsym $mod+Page_Down move scratchpad
## Show the hidden windows of the scratchpad
bindsym $mod+z scratchpad show
## Keep the window on every workspace
bindsym $mod+Shift+g sticky toggle

# --- Layouts ---
### Layouts
## Next layout: side by side, stacked, tabs
bindsym --no-warn Mod1+space layout toggle splith splitv stacking tabbed
## Side-by-side layout
bindsym Mod1+t layout splith
## Tabbed layout
bindsym Mod1+m layout tabbed
## Wider gaps between windows
bindsym $mod+Ctrl+x gaps inner current plus 2
## Narrower gaps between windows
bindsym $mod+Ctrl+z gaps inner current minus 2
## Gaps between windows on or off
bindsym $mod+Ctrl+r gaps inner current toggle 5

# --- Workspaces (as tags do dwm): como no dwm, mover a janela não leva o foco junto ---
### Workspaces
## Go to workspace
bindsym Mod1+1 workspace number 1
bindsym Mod1+2 workspace number 2
bindsym Mod1+3 workspace number 3
bindsym Mod1+4 workspace number 4
bindsym Mod1+5 workspace number 5
bindsym Mod1+6 workspace number 6
bindsym Mod1+7 workspace number 7
bindsym Mod1+8 workspace number 8
bindsym Mod1+9 workspace number 9
## Move the window to workspace
bindsym Mod1+Shift+1 move container to workspace number 1
bindsym Mod1+Shift+2 move container to workspace number 2
bindsym Mod1+Shift+3 move container to workspace number 3
bindsym Mod1+Shift+4 move container to workspace number 4
bindsym Mod1+Shift+5 move container to workspace number 5
bindsym Mod1+Shift+6 move container to workspace number 6
bindsym Mod1+Shift+7 move container to workspace number 7
bindsym Mod1+Shift+8 move container to workspace number 8
bindsym Mod1+Shift+9 move container to workspace number 9
## Go back to the last workspace
bindsym --no-warn Mod1+Tab workspace back_and_forth
## Go to the previous workspace
bindsym $mod+Left       exec $bin/sway-ws prev
## Go to the next workspace
bindsym $mod+Right      exec $bin/sway-ws next
## Move the window to the previous workspace
bindsym $mod+Ctrl+Left  exec $bin/sway-ws prev move
## Move the window to the next workspace
bindsym $mod+Ctrl+Right exec $bin/sway-ws next move

# --- Monitores ---
### Monitors
## Focus the monitor on the left
bindsym Mod1+comma  focus output left
## Focus the monitor on the right
bindsym Mod1+period focus output right
## Move the window to the monitor on the left
bindsym Mod1+Shift+comma  move container to output left,  focus output left
## Move the window to the monitor on the right
bindsym Mod1+Shift+period move container to output right, focus output right

# --- Painéis de captura e de gravação (sway-capture) ---
### Screenshots and recording
## Screenshot panel
bindsym $mod+Shift+e exec $bin/sway-capture shot
## Screen recording panel; during a recording, stops it
bindsym $mod+Shift+r exec $bin/sway-capture rec
