# Perfil i3: as teclas do config padrão do i3 (J/K/L/; e as setas, Super+Shift+número sem ir junto, o modo de
# redimensionar no Super+R). Vem depois do keys/base.conf. As ações do Swaydesk que o i3 não tem ficam em teclas
# livres dele. "## Texto" descreve o bind de baixo na Ajuda (Super+F1), e "### Texto" abre uma seção

# --- Sessão e apps ---
### Session and apps
## Reload the Sway config
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r reload
## Log out: the session menu
bindsym $mod+Shift+e exec $bin/session-menu
## Close the window
bindsym $mod+Shift+q kill
## Open the terminal
bindsym $mod+Return exec $term
## Open the launcher
bindsym $mod+d exec $bin/sway-launcher toggle
## Show the notifications
bindsym $mod+c exec $bin/waybar-notifications-popup
## Show the clipboard history
bindsym $mod+Shift+v exec $bin/waybar-clipboard-popup
## Search the open windows
bindcode $mod+49 exec $bin/sway-launcher windows
## Switch the keyboard layout
bindsym $mod+Ctrl+space input type:keyboard xkb_switch_layout next
## Show this help
bindsym $mod+slash exec $bin/sway-help

# --- Foco ---
### Focus
## Focus the window on the left
bindsym $mod+j     focus left
bindsym $mod+Left  focus left
## Focus the window below
bindsym $mod+k     focus down
bindsym $mod+Down  focus down
## Focus the window above
bindsym $mod+l     focus up
bindsym $mod+Up    focus up
## Focus the window on the right
bindsym $mod+semicolon focus right
bindsym $mod+Right     focus right
## Focus the next window on the screen
bindsym $mod+Tab       focus next
## Focus the previous window on the screen
bindsym $mod+Shift+Tab focus prev
## Switch the focus between floating and tiled windows
bindsym $mod+space focus mode_toggle
## Focus the parent container
bindsym $mod+a focus parent

# --- Mover e redimensionar ---
### Move and resize
## Move the window left
bindsym $mod+Shift+j     move left
bindsym $mod+Shift+Left  move left
## Move the window down
bindsym $mod+Shift+k     move down
bindsym $mod+Shift+Down  move down
## Move the window up
bindsym $mod+Shift+l     move up
bindsym $mod+Shift+Up    move up
## Move the window right
bindsym $mod+Shift+semicolon move right
bindsym $mod+Shift+Right     move right
## Resize mode: J/K/L/; or the arrows, Enter or Esc to leave
bindsym $mod+r mode "resize"
mode "resize" {
    ## Narrower
    bindsym j     resize shrink width 10px
    bindsym Left  resize shrink width 10px
    ## Taller
    bindsym k     resize grow height 10px
    bindsym Down  resize grow height 10px
    ## Shorter
    bindsym l     resize shrink height 10px
    bindsym Up    resize shrink height 10px
    ## Wider
    bindsym semicolon resize grow width 10px
    bindsym Right     resize grow width 10px
    ## Leave the resize mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}

# --- Janelas ---
### Windows
## Swap the window with the main one
bindsym $mod+Shift+Return exec $bin/sway-master
## Float or tile the window
bindsym $mod+Shift+space floating toggle
## Fullscreen
bindsym $mod+f fullscreen toggle
## Hide the window in the scratchpad
bindsym $mod+Shift+minus move scratchpad
## Show the hidden windows of the scratchpad
bindsym $mod+minus scratchpad show
## Keep the window on every workspace
bindsym $mod+Shift+g sticky toggle

# --- Layouts ---
### Layouts
## Stacked layout
bindsym $mod+s layout stacking
## Tabbed layout
bindsym $mod+w layout tabbed
## Switch the split: side by side or one above the other
bindsym $mod+e layout toggle split
## Open the next window beside this one
bindsym $mod+h splith
## Open the next window below this one
bindsym $mod+v splitv
## Wider gaps between windows
bindsym $mod+Ctrl+equal gaps inner current plus 2
## Narrower gaps between windows
bindsym $mod+Ctrl+minus gaps inner current minus 2
## Gaps between windows on or off
bindsym $mod+Ctrl+0 gaps inner current toggle 5

# --- Workspaces: como no i3, mover a janela não leva o foco junto ---
### Workspaces
## Go to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
## Move the window to workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
## Go to the previous workspace
bindsym $mod+Ctrl+Left  exec $bin/sway-ws prev
## Go to the next workspace
bindsym $mod+Ctrl+Right exec $bin/sway-ws next
## Move the window to the previous workspace
bindsym $mod+Ctrl+Shift+Left  exec $bin/sway-ws prev move
## Move the window to the next workspace
bindsym $mod+Ctrl+Shift+Right exec $bin/sway-ws next move

# --- Monitores ---
### Monitors
## Focus the monitor on the left
bindsym $mod+bracketleft  focus output left
## Focus the monitor on the right
bindsym $mod+bracketright focus output right
## Move the window to the monitor on the left
bindsym $mod+Shift+bracketleft  move container to output left,  focus output left
## Move the window to the monitor on the right
bindsym $mod+Shift+bracketright move container to output right, focus output right

# --- Painéis de captura e de gravação (sway-capture) ---
### Screenshots and recording
## Screenshot panel
bindsym $mod+Ctrl+s exec $bin/sway-capture shot
## Screen recording panel; during a recording, stops it
bindsym $mod+Ctrl+r exec $bin/sway-capture rec
