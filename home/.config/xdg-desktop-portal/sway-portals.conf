[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# Como no do pacote do Sway, que este substitui: o Inhibit do gtk usa o org.gnome.SessionManager, que o Sway não tem;
# sem backend, o Firefox e outros usam o idle-inhibit do Wayland
org.freedesktop.impl.portal.Inhibit=none
# A cor de destaque vem do sway-portal, que só tem ela; o resto, do gtk
org.freedesktop.impl.portal.Settings=swaydesktop;gtk
