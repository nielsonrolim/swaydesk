# Do Swaydesk: na sessão dele, o update-notifier do autostart (Ubuntu) não sobe, porque o sway-update-notifier
# já o roda (ou o gnome-software, ou o DiscoverNotifier), e a segunda cópia falhava no login, deixando a unit
# "failed". Os outros dois não precisam: as entradas deles são OnlyShowIn=GNOME;Unity; e OnlyShowIn=KDE. Nas
# outras sessões, nada muda: o sway-session exporta o SWAYDESK_SESSION para o systemd do usuário, e o
# sway-env-cleanup o tira no logout
[Unit]
ConditionEnvironment=!SWAYDESK_SESSION
