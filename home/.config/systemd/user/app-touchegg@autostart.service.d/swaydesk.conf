# Do Swaydesk: na sessão dele, o cliente do touchegg (Mint) não sobe. Ele executa os gestos do touchpad pelo X11
# (no Sway, só nas janelas do Xwayland), e os gestos de 3 e 4 dedos já são do Sway (bindgesture em
# keys/base.conf): os dois responderiam ao mesmo gesto. Antes do autostart (0.1.4) a sessão nunca o rodava. No
# Cinnamon da mesma conta, nada muda
[Unit]
ConditionEnvironment=!SWAYDESK_SESSION
