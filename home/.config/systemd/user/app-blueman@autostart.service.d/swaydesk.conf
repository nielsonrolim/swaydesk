# Do Swaydesk: na sessão dele, esta entrada do autostart não sobe, porque o Swaydesk já roda o mesmo programa
# ou um substituto (o blueman-agent, o nm-applet sem ícone, o sway-polkit-agent, a bandeja da Waybar), e uma
# segunda cópia duplicaria o ícone na bandeja ou o agente. Nas outras sessões, nada muda: o sway-session
# exporta o SWAYDESK_SESSION para o systemd do usuário, e o sway-env-cleanup o tira no logout
[Unit]
ConditionEnvironment=!SWAYDESK_SESSION
