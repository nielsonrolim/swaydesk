# Do Swaydesk: o pulseaudio.desktop do /etc/xdg/autostart (start-pulseaudio-x11, os módulos X11 do servidor de
# som) falha quando quem dá o servidor pulse é o PipeWire, o padrão do Debian, do Ubuntu e do Arch, e deixava uma
# unit "failed" a cada login. Na sessão do Swaydesk, com o pipewire-pulse ativo, ele é pulado (sem falha); com o
# pulseaudio de verdade, ele roda como antes, e nas outras sessões nada muda. O $$ é o $ do shell: o systemd
# expande o $ sozinho
[Service]
ExecCondition=/bin/sh -c 'test -z "$${SWAYDESK_SESSION}" || ! systemctl --user --quiet is-active pipewire-pulse.socket pipewire-pulse.service'
