# Do Swaydesk: na sessão dele, o im-launch do im-config (Mint, Ubuntu) não sobe. Antes do autostart (0.1.4) a
# sessão nunca o rodava; no Mint ele sobe o ibus-daemon, que no Wayland fora do GNOME e do KDE mostra o aviso
# "IBus should be called from the desktop session". O ambiente do im-config (GTK_IM_MODULE=ibus) vem do
# Xsession do LightDM para toda sessão, então não serve para saber se quem usa escolheu um método de entrada:
# quem quer o ibus ou o fcitx5 no Swaydesk o sobe no config do Sway (exec ibus-daemon -drx). O fcitx5 do Arch
# tem a entrada dele (org.fcitx.Fcitx5.desktop), que só existe se foi instalado, e essa sobe. Nas outras
# sessões, nada muda
[Unit]
ConditionEnvironment=!SWAYDESK_SESSION
