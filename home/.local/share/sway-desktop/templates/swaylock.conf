# Tema Mint-Y-Dark-Teal (cores de /usr/share/themes/Mint-Y-Dark-Teal)
# O papel de parede continua vindo da linha de comando (-i ... em sway/config)

color=222226
font=Noto Sans
font-size=22
indicator-radius=90
indicator-thickness=8
indicator-caps-lock
show-failed-attempts

# Centro do indicador
inside-color=2e2e33e6
inside-clear-color=2e2e33e6
inside-caps-lock-color=2e2e33e6
inside-ver-color=2e2e33e6
inside-wrong-color=2e2e33e6

# Anel: cinza parado, destaque verificando, vermelho errado, laranja apagado
ring-color=4c4c50
ring-clear-color=f27835
ring-caps-lock-color=f27835
ring-ver-color={{accent}}
ring-wrong-color=fc4138

# Destaque de tecla digitada / backspace
key-hl-color={{accent}}
caps-lock-key-hl-color={{accent}}
bs-hl-color=f27835
caps-lock-bs-hl-color=fc4138

# Sem linhas entre anel e centro
line-color=00000000
line-clear-color=00000000
line-caps-lock-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000

# Texto
text-color=dadada
text-clear-color=dadada
text-caps-lock-color=f27835
text-ver-color=ffffff
text-wrong-color=fc4138
layout-bg-color=2e2e33e6
layout-border-color=00000000
layout-text-color=dadada
