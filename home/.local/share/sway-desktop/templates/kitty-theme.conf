# vim:ft=kitty

## name: Sway Desktop
## author: gerado por sway-theme: edite o modelo em home/.local/share/sway-desktop/templates/
## blurb: Fundo grafite com a cor de destaque. As cores ANSI são fixas: o ciano dos programas não muda com o tema.

# Basic colors
foreground           #dadada
background           #2e2e33
selection_foreground #{{on_accent}}
selection_background #{{accent}}

# Cursor colors
cursor            #{{accent}}
cursor_text_color #{{on_accent}}

# URL underline color when hovering with mouse
url_color #{{bright}}

# Window border colors and terminal bell colors
active_border_color   #{{accent}}
inactive_border_color #4c4c50
bell_border_color     #f27835

# Tab bar colors
active_tab_foreground   #{{on_accent}}
active_tab_background   #{{accent}}
inactive_tab_foreground #dadada
inactive_tab_background #2e2e33
tab_bar_background      #222226

# Mark colors (marked text in the terminal)
mark1_foreground #2e2e33
mark1_background #{{accent}}
mark2_foreground #2e2e33
mark2_background #f27835
mark3_foreground #2e2e33
mark3_background #8c5dd8

# The basic 16 colors
# black
color0 #222226
color8 #5c5c62

# red
color1 #fc4138
color9 #ff6b63

# green
color2  #73d216
color10 #9be35a

# yellow
color3  #f2c94c
color11 #f7dc7f

# blue
color4  #1f9ede
color12 #4fb3f0

# magenta
color5  #8c5dd8
color13 #b088f0

# cyan
color6  #199ca8
color14 #29d0df

# white
color7  #dadada
color15 #ffffff
